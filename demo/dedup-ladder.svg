<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="'Segoe UI',system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f2b33"/>
      <stop offset="100%" stop-color="#0a1c22"/>
    </linearGradient>
    <pattern id="hazard" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="14" height="14" fill="#7f1d1d"/>
      <rect width="7" height="14" fill="#991b1b"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- title -->
  <text x="600" y="62" text-anchor="middle" fill="#f8fafc" font-size="34" font-weight="700">
    The gap in the deduplication ladder
  </text>
  <text x="600" y="96" text-anchor="middle" fill="#7dd3c0" font-size="19">
    Before saving a fact, the agent scores how similar it is to what it already knows
  </text>
  <text x="600" y="122" text-anchor="middle" fill="#64808a" font-size="16">
    0.0 = identical &#160;·&#160; 1.0 = unrelated
  </text>

  <!-- ============ ORIGINAL ============ -->
  <text x="300" y="182" text-anchor="middle" fill="#94a3b8" font-size="21" font-weight="600" letter-spacing="2">ORIGINAL</text>

  <rect x="170" y="205" width="260" height="82" rx="6" fill="#164e49" stroke="#2b7a70" stroke-width="1.5"/>
  <text x="300" y="240" text-anchor="middle" fill="#a7f3d0" font-size="17" font-weight="600">d &lt; 0.25</text>
  <text x="300" y="266" text-anchor="middle" fill="#8ab8ae" font-size="15">skip — duplicate</text>

  <rect x="170" y="295" width="260" height="82" rx="6" fill="#164e49" stroke="#2b7a70" stroke-width="1.5"/>
  <text x="300" y="330" text-anchor="middle" fill="#a7f3d0" font-size="17" font-weight="600">0.25 – 0.55</text>
  <text x="300" y="356" text-anchor="middle" fill="#8ab8ae" font-size="15">decide</text>

  <!-- the gap -->
  <rect x="170" y="385" width="260" height="82" rx="6" fill="url(#hazard)" stroke="#ef4444" stroke-width="2.5"/>
  <text x="300" y="418" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">0.55 – 0.70</text>
  <text x="300" y="444" text-anchor="middle" fill="#fecaca" font-size="15" font-weight="600">NO RULE AT ALL</text>

  <rect x="170" y="475" width="260" height="82" rx="6" fill="#164e49" stroke="#2b7a70" stroke-width="1.5"/>
  <text x="300" y="510" text-anchor="middle" fill="#a7f3d0" font-size="17" font-weight="600">d &#8805; 0.70</text>
  <text x="300" y="536" text-anchor="middle" fill="#8ab8ae" font-size="15">write — unrelated</text>

  <text x="300" y="596" text-anchor="middle" fill="#f87171" font-size="15" font-weight="600">Undefined behaviour</text>
  <text x="300" y="620" text-anchor="middle" fill="#c88" font-size="14">a duplicate you paid for,</text>
  <text x="300" y="640" text-anchor="middle" fill="#c88" font-size="14">or a real fact silently lost</text>

  <!-- arrow -->
  <path d="M 470 385 L 720 385" stroke="#7dd3c0" stroke-width="2.5" fill="none"/>
  <path d="M 712 377 L 726 385 L 712 393 Z" fill="#7dd3c0"/>
  <text x="595" y="370" text-anchor="middle" fill="#7dd3c0" font-size="15" font-weight="600">v2 closes it</text>

  <!-- ============ V2 ============ -->
  <text x="900" y="182" text-anchor="middle" fill="#f8fafc" font-size="21" font-weight="700" letter-spacing="2">CONTINUITY KEEPER v2</text>

  <rect x="770" y="205" width="260" height="82" rx="6" fill="#164e49" stroke="#2b7a70" stroke-width="1.5"/>
  <text x="900" y="240" text-anchor="middle" fill="#a7f3d0" font-size="17" font-weight="600">d &lt; 0.25</text>
  <text x="900" y="266" text-anchor="middle" fill="#8ab8ae" font-size="15">skip — duplicate</text>

  <rect x="770" y="295" width="260" height="82" rx="6" fill="#164e49" stroke="#2b7a70" stroke-width="1.5"/>
  <text x="900" y="330" text-anchor="middle" fill="#a7f3d0" font-size="17" font-weight="600">0.25 – 0.55</text>
  <text x="900" y="356" text-anchor="middle" fill="#8ab8ae" font-size="15">decide</text>

  <rect x="770" y="385" width="260" height="82" rx="6" fill="#1e4620" stroke="#4ade80" stroke-width="2.5"/>
  <text x="900" y="418" text-anchor="middle" fill="#bbf7d0" font-size="17" font-weight="700">0.55 – 0.70</text>
  <text x="900" y="444" text-anchor="middle" fill="#86efac" font-size="15" font-weight="600">tiebreak on entity name</text>

  <rect x="770" y="475" width="260" height="82" rx="6" fill="#164e49" stroke="#2b7a70" stroke-width="1.5"/>
  <text x="900" y="510" text-anchor="middle" fill="#a7f3d0" font-size="17" font-weight="600">d &#8805; 0.70</text>
  <text x="900" y="536" text-anchor="middle" fill="#8ab8ae" font-size="15">write — unrelated</text>

  <text x="900" y="596" text-anchor="middle" fill="#4ade80" font-size="15" font-weight="600">Every range has a rule</text>
  <text x="900" y="620" text-anchor="middle" fill="#8ab8ae" font-size="14">same entity → possible update</text>
  <text x="900" y="640" text-anchor="middle" fill="#8ab8ae" font-size="14">different entity → write</text>

  <!-- measured evidence -->
  <rect x="170" y="655" width="860" height="0" fill="none"/>
  <text x="600" y="668" text-anchor="middle" fill="#fbbf24" font-size="15" font-weight="600">
    Measured on Walrus mainnet: a real record landed at 0.5926 — inside the gap — on the first calibration run
  </text>
</svg>
